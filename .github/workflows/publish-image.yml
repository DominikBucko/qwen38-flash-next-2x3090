name: publish-image

# Builds docker/Dockerfile at a release tag and publishes it to GHCR with an
# immutable digest, OCI labels that name the source commit and base image, and
# a signed build-provenance attestation. Model weights are not in the image.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.3.0"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-image-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Resolve names
        id: meta
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3: $TAG" >&2; exit 1; }
          sha=$(git rev-parse HEAD)
          base=$(sed -n 's/^FROM //p' docker/Dockerfile | head -1)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "base=$base"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Repository checks
        run: python3 scripts/validate_repo.py

      - name: Free runner disk
        # The pinned vLLM base image is about 29 GB uncompressed.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.TAG }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.title=qwen38-flash-next-2x3090
            org.opencontainers.image.description=vLLM runtime overlay for Qwen3.8-Flash-Next on 2x RTX 3090 (weights not included)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=${{ steps.meta.outputs.base }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```text'
            echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo "${{ steps.meta.outputs.image }}:${TAG}"
            echo "source commit: ${{ steps.meta.outputs.sha }}"
            echo "base image:    ${{ steps.meta.outputs.base }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
