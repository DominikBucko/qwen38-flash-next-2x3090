name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository invariants
        run: python scripts/validate_repo.py
      - name: Run GPU-free regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p 'test_ple_capture_hook.py' -v
          python -m unittest discover -s tests -p 'test_serve_flags.py' -v
          python -m unittest discover -s tests -p 'test_benchmark_serving.py' -v
      - name: Check Python syntax
        run: >-
          python -m compileall -q
          scripts runtime/install_overlay.py runtime/vllm-overlay
          tests
      - name: Check shell syntax
        run: bash -n scripts/*.sh
