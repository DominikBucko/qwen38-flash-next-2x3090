  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536273" transform="translate(73.872 422.432437)">API-observed cumulative decode rate = tokens after the first output chunk ÷ elapsed time after that chunk.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536273" transform="translate(73.872 435.482438)">Each point is the first SSE chunk reaching a gate; x shows that chunk’s actual emitted count. No cross-run mean.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536273" transform="translate(73.872 448.532437)">All completion tokens count, including reasoning. Forced output length is not an answer-quality score.</text>
