  <g id="text_20">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(73.872 75.389861)">Declared serving profile: Native isolated pinned vendor + public overlay · hot cache 84 · custom all-reduce enabled ·</text>
